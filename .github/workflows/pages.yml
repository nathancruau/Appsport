name: Deploy to GitHub Pages

on:
  push:
    branches: [main, merge-to-main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm install

      - name: Export Expo web app
        run: npx expo export --platform web

      - name: Write version file for auto-update
        run: echo '{"v":"${{ github.sha }}"}' > dist/version.json

      - name: Create PWA icon
        run: |
          python3 << 'PYEOF'
          import struct, zlib
          S = 180
          def chunk(tag, data):
              crc = zlib.crc32(tag + data) & 0xffffffff
              return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', crc)
          img = [[[0,0,0,0]]*S for _ in range(S)]
          def fill_rrect(x1,y1,x2,y2,rad,r,g,b):
              for y in range(max(0,y1),min(S,y2)):
                  for x in range(max(0,x1),min(S,x2)):
                      ok=True
                      if x<x1+rad and y<y1+rad: ok=(x-x1-rad)**2+(y-y1-rad)**2<=rad*rad
                      elif x>=x2-rad and y<y1+rad: ok=(x-x2+rad)**2+(y-y1-rad)**2<=rad*rad
                      elif x<x1+rad and y>=y2-rad: ok=(x-x1-rad)**2+(y-y2+rad)**2<=rad*rad
                      elif x>=x2-rad and y>=y2-rad: ok=(x-x2+rad)**2+(y-y2+rad)**2<=rad*rad
                      if ok: img[y][x]=[r,g,b,255]
          fill_rrect(0,0,S,S,36,26,26,26)
          W=255
          fill_rrect(14,54,32,126,6,W,W,W)
          fill_rrect(32,63,48,117,5,W,W,W)
          fill_rrect(48,79,132,101,4,W,W,W)
          fill_rrect(132,63,148,117,5,W,W,W)
          fill_rrect(148,54,166,126,6,W,W,W)
          raw=b''.join(b'\x00'+b''.join(bytes(p) for p in row) for row in img)
          ihdr=struct.pack('>IIBBBBB',S,S,8,6,0,0,0)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',ihdr)+chunk(b'IDAT',zlib.compress(raw,6))+chunk(b'IEND',b'')
          open('dist/icon.png','wb').write(png)
          print('barbell icon created (180x180)')
          PYEOF

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/merge-to-main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
